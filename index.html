    .site-footer{
      position:relative;
      z-index:2;
      max-width:980px;
      margin:40px auto 24px;
      padding:22px 18px;
      text-align:center;
      font-family:"Zen Maru Gothic","Noto Serif TC",serif;
      color:rgba(48,70,84,.86);
      font-size:14px;
      line-height:1.8;
    }

    .site-footer p{
      margin:4px 0;
    }

    .site-footer a{
      color:rgba(48,70,84,.95);
      text-decoration:none;

<body>
  <div class="bg-art"></div>
  <div class="bg-mountain"></div>
  <div class="bg-clouds"></div>

  <div class="bg-lantern"></div>
  <div class="bg-blossom"></div>

  <main class="wrap">

      <p id="siteSubtitle">不喜歡我就不要看我，再看戳你馬啾！不會的歌也可以詢問喔w</p>

      <div class="controls">
